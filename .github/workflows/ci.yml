name: C CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }}

      - name: Compile
        env:
          CC: ${{ matrix.compiler }}
        run: |
          $CC -std=c17 -Wall -Wextra -Wpedantic -Werror \
            src/*.c -o app

      - name: Run
        run: ./app
