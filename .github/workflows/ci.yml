name: C CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  compile:
    name: Compile with ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C Programs
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -e

          BUILD_DIR="$(mktemp -d)"

          find . \
            -type f \
            -name "*.c" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            relative_path="${file#./}"
            output="$BUILD_DIR/${relative_path%.c}"

            mkdir -p "$(dirname "$output")"

            echo "Compiling: $relative_path"

            "$CC" \
              -std=c17 \
              -Wall \
              -Wextra \
              -Wpedantic \
              -Werror \
              "$file" \
              -o "$output"
          done

          echo "All C programs compiled successfully."
